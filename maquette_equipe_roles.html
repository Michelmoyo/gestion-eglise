<h2 class="sr-only">Equipe et roles du departement Chorale, avec possibilite de changer le role d'un ouvrier</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 2rem 1rem; display:flex; justify-content:center;">
  <div style="width:320px; background:var(--color-background-primary); border-radius:20px; border:0.5px solid var(--color-border-tertiary); padding:1.25rem 1rem;">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.25rem;">
      <i class="ti ti-arrow-left" style="font-size:18px; color:var(--color-text-secondary);" aria-hidden="true"></i>
      <p style="font-size:16px; font-weight:500; margin:0;">Equipe &middot; Chorale</p>
    </div>

    <div id="team-list" style="display:flex; flex-direction:column;"></div>
  </div>
</div>

<script>
const team = [
  {name:'Jean Kabila', initials:'JK', role:'President'},
  {name:'Marie Tshala', initials:'MT', role:'Vice-president'},
  {name:'Joseph Mbuyi', initials:'JM', role:'Secretaire'},
  {name:'Esther Kalonji', initials:'EK', role:'Tresorier'},
  {name:'Paul Ilunga', initials:'PI', role:'Membre'},
  {name:'Grace Mwamba', initials:'GM', role:'Membre'}
];
const list = document.getElementById('team-list');
team.forEach(function(t) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:0.5px solid var(--color-border-tertiary);';
  row.innerHTML =
    '<span style="width:32px; height:32px; border-radius:50%; background:var(--color-background-info); color:var(--color-text-info); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; flex-shrink:0;">' + t.initials + '</span>' +
    '<span style="flex:1; font-size:14px;">' + t.name + '</span>' +
    '<span style="font-size:11px; padding:3px 8px; border-radius:var(--border-radius-md); background:var(--color-background-secondary); color:var(--color-text-secondary);">' + t.role + '</span>' +
    '<i class="ti ti-edit team-edit" style="font-size:16px; color:var(--color-text-tertiary); cursor:pointer;" aria-hidden="true"></i>';
  row.querySelector('.team-edit').onclick = function() { sendPrompt('Change le role de ' + t.name + ' dans le departement Chorale'); };
  list.appendChild(row);
});
</script>
