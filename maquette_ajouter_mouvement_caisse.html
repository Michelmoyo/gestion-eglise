<h2 class="sr-only">Formulaire d'ajout d'un mouvement de caisse pour le departement Chorale</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 2rem 1rem; display:flex; justify-content:center;">
  <div style="width:320px; background:var(--color-background-primary); border-radius:20px; border:0.5px solid var(--color-border-tertiary); padding:1.25rem 1rem;">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.25rem;">
      <i class="ti ti-arrow-left" style="font-size:18px; color:var(--color-text-secondary);" aria-hidden="true"></i>
      <p style="font-size:16px; font-weight:500; margin:0;">Nouveau mouvement</p>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:14px;" id="type-toggle">
      <button data-type="entree" style="flex:1;">Entree</button>
      <button data-type="sortie" style="flex:1;">Sortie</button>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:1.25rem;">
      <div>
        <label style="font-size:12px; color:var(--color-text-secondary); display:block; margin-bottom:4px;">Montant</label>
        <input type="number" placeholder="0" style="width:100%;" />
      </div>
      <div>
        <label style="font-size:12px; color:var(--color-text-secondary); display:block; margin-bottom:4px;">Date</label>
        <input type="date" style="width:100%;" />
      </div>
      <div>
        <label id="motif-label" style="font-size:12px; color:var(--color-text-secondary); display:block; margin-bottom:4px;">Motif</label>
        <textarea placeholder="Ex : Achat de partitions" style="width:100%; min-height:50px;"></textarea>
      </div>
    </div>

    <button style="width:100%;" onclick="sendPrompt('Confirme l\'enregistrement du mouvement de caisse')">Enregistrer ↗</button>
  </div>
</div>

<script>
const buttons = document.querySelectorAll('#type-toggle button');
const motifLabel = document.getElementById('motif-label');
let selected = 'sortie';
function paint() {
  buttons.forEach(function(b) {
    if (b.dataset.type === selected) {
      b.style.background = b.dataset.type === 'entree' ? 'var(--color-background-success)' : 'var(--color-background-danger)';
      b.style.color = b.dataset.type === 'entree' ? 'var(--color-text-success)' : 'var(--color-text-danger)';
    } else {
      b.style.background = '';
      b.style.color = '';
    }
  });
  motifLabel.textContent = selected === 'sortie' ? 'Motif (obligatoire)' : 'Motif (optionnel)';
}
buttons.forEach(function(b) {
  b.onclick = function() { selected = b.dataset.type; paint(); };
});
paint();
</script>
