<h2 class="sr-only">Enregistrement des presences pour la repetition de la Chorale, avec un choix present absent ou excuse pour chaque ouvrier</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 2rem 1rem; display:flex; justify-content:center;">
  <div style="width:320px; background:var(--color-background-primary); border-radius:20px; border:0.5px solid var(--color-border-tertiary); padding:1.25rem 1rem;">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.25rem;">
      <i class="ti ti-arrow-left" style="font-size:18px; color:var(--color-text-secondary);" aria-hidden="true"></i>
      <div>
        <p style="font-size:15px; font-weight:500; margin:0;">Répétition</p>
        <p style="font-size:12px; color:var(--color-text-secondary); margin:0;">Aujourd'hui, 18h00 &middot; Chorale</p>
      </div>
    </div>

    <div id="presence-list" style="display:flex; flex-direction:column; gap:14px; margin-bottom:1.25rem;"></div>

    <button id="save-btn" style="width:100%;">Enregistrer ↗</button>
  </div>
</div>

<script>
const ouvriers = [
  {id:1, name:'Jean Kabila', initials:'JK'},
  {id:2, name:'Marie Tshala', initials:'MT'},
  {id:3, name:'Joseph Mbuyi', initials:'JM'},
  {id:4, name:'Esther Kalonji', initials:'EK'},
  {id:5, name:'Paul Ilunga', initials:'PI'},
  {id:6, name:'Grace Mwamba', initials:'GM'}
];
const state = {};
ouvriers.forEach(function(o) { state[o.id] = null; });

function segStyle(active, kind) {
  if (!active) {
    return 'flex:1; padding:8px 0; font-size:12px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); background:var(--color-background-primary); color:var(--color-text-secondary); cursor:pointer; text-align:center;';
  }
  const map = {
    present: 'background:var(--color-background-success); color:var(--color-text-success);',
    absent: 'background:var(--color-background-danger); color:var(--color-text-danger);',
    excuse: 'background:var(--color-background-warning); color:var(--color-text-warning);'
  };
  return 'flex:1; padding:8px 0; font-size:12px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); cursor:pointer; text-align:center; font-weight:500;' + map[kind];
}

function render() {
  const list = document.getElementById('presence-list');
  list.innerHTML = '';
  ouvriers.forEach(function(o) {
    const row = document.createElement('div');
    const current = state[o.id];
    row.innerHTML =
      '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">' +
        '<span style="width:32px; height:32px; border-radius:50%; background:var(--color-background-info); color:var(--color-text-info); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; flex-shrink:0;">' + o.initials + '</span>' +
        '<span style="font-size:14px;">' + o.name + '</span>' +
      '</div>' +
      '<div style="display:flex; gap:6px;">' +
        '<button data-kind="present" style="' + segStyle(current==='present','present') + '">Présent</button>' +
        '<button data-kind="absent" style="' + segStyle(current==='absent','absent') + '">Absent</button>' +
        '<button data-kind="excuse" style="' + segStyle(current==='excuse','excuse') + '">Excusé</button>' +
      '</div>' +
      (current === 'excuse' ? '<input type="text" placeholder="Motif (optionnel)" style="width:100%; margin-top:6px; font-size:12px;" />' : '');
    row.querySelectorAll('button').forEach(function(btn) {
      btn.onclick = function() { state[o.id] = btn.dataset.kind; render(); };
    });
    list.appendChild(row);
  });
}
render();

document.getElementById('save-btn').onclick = function() {
  let present = 0, absent = 0, excuse = 0;
  ouvriers.forEach(function(o) {
    if (state[o.id] === 'present') present++;
    else if (state[o.id] === 'absent') absent++;
    else if (state[o.id] === 'excuse') excuse++;
  });
  sendPrompt('Confirme les presences de la repetition Chorale: ' + present + ' present(s), ' + absent + ' absent(s), ' + excuse + ' excuse(s)');
};
</script>
