<h2 class="sr-only">Rapport mensuel du departement Chorale pour juin</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 2rem 1rem; display:flex; justify-content:center;">
  <div style="width:320px; background:var(--color-background-primary); border-radius:20px; border:0.5px solid var(--color-border-tertiary); padding:1.25rem 1rem;">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.25rem;">
      <i class="ti ti-arrow-left" style="font-size:18px; color:var(--color-text-secondary);" aria-hidden="true"></i>
      <p style="font-size:16px; font-weight:500; margin:0;">Rapport &middot; juin 2026</p>
    </div>

    <div style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; margin-bottom:1.25rem;">
      <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:0.75rem;">
        <p style="font-size:12px; color:var(--color-text-secondary); margin:0 0 4px;">Nouveaux ouvriers</p>
        <p style="font-size:20px; font-weight:500; margin:0;">3</p>
      </div>
      <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:0.75rem;">
        <p style="font-size:12px; color:var(--color-text-secondary); margin:0 0 4px;">Departs / suspensions</p>
        <p style="font-size:20px; font-weight:500; margin:0;">1</p>
      </div>
      <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:0.75rem;">
        <p style="font-size:12px; color:var(--color-text-secondary); margin:0 0 4px;">Activites du mois</p>
        <p style="font-size:20px; font-weight:500; margin:0;">6</p>
      </div>
      <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:0.75rem;">
        <p style="font-size:12px; color:var(--color-text-secondary); margin:0 0 4px;">Solde caisse</p>
        <p style="font-size:20px; font-weight:500; margin:0;">145 000 FC</p>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:1.25rem;">
      <div>
        <label style="font-size:12px; color:var(--color-text-secondary); display:block; margin-bottom:4px;">Difficultes</label>
        <textarea style="width:100%; min-height:50px;"></textarea>
      </div>
      <div>
        <label style="font-size:12px; color:var(--color-text-secondary); display:block; margin-bottom:4px;">Besoins</label>
        <textarea style="width:100%; min-height:50px;"></textarea>
      </div>
      <div>
        <label style="font-size:12px; color:var(--color-text-secondary); display:block; margin-bottom:4px;">Objectifs du mois</label>
        <textarea style="width:100%; min-height:50px;"></textarea>
      </div>
    </div>

    <button style="width:100%;" onclick="sendPrompt('Confirme la soumission du rapport de juin pour la Chorale')">Soumettre le rapport ↗</button>
  </div>
</div>
