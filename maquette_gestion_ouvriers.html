<h2 class="sr-only">Liste des ouvriers de l'eglise avec recherche et ajout</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 2rem 1rem; display:flex; justify-content:center;">
  <div style="width:320px; background:var(--color-background-primary); border-radius:20px; border:0.5px solid var(--color-border-tertiary); padding:1.25rem 1rem;">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
      <p style="font-size:16px; font-weight:500; margin:0;">Ouvriers</p>
      <button onclick="sendPrompt('Montre le formulaire d\'ajout d\'un ouvrier')" style="font-size:12px; padding:6px 10px;">+ Ajouter</button>
    </div>

    <input type="text" placeholder="Rechercher un ouvrier" style="width:100%; margin-bottom:12px;" />

    <div style="display:flex; flex-direction:column;" id="workers-list"></div>
  </div>
</div>

<script>
const workers = [
  {name:'Jean Kabila', initials:'JK', status:'Actif', depts:'Chorale'},
  {name:'Marie Tshala', initials:'MT', status:'Actif', depts:'Chorale, Accueil'},
  {name:'Joseph Mbuyi', initials:'JM', status:'Actif', depts:'Chorale'},
  {name:'David Kasongo', initials:'DK', status:'Inactif', depts:'Evangelisation'}
];
const list = document.getElementById('workers-list');
workers.forEach(function(w) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:0.5px solid var(--color-border-tertiary);';
  const statusColor = w.status === 'Actif' ? 'var(--color-text-success)' : 'var(--color-text-tertiary)';
  row.innerHTML =
    '<span style="width:32px; height:32px; border-radius:50%; background:var(--color-background-info); color:var(--color-text-info); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; flex-shrink:0;">' + w.initials + '</span>' +
    '<span style="flex:1; min-width:0;"><span style="display:block; font-size:14px;">' + w.name + '</span>' +
    '<span style="display:block; font-size:11px; color:var(--color-text-secondary);">' + w.depts + '</span></span>' +
    '<span style="font-size:11px; color:' + statusColor + ';">' + w.status + '</span>';
  list.appendChild(row);
});
</script>
